name: Playwright Tests

on:
  # Daily at 13:17 India time (IST = UTC+5:30; cron is in UTC): the full suite.
  # Midday IST and an odd minute: GitHub delays or drops scheduled runs when busy, most often in the
  # early-morning IST hours and at the top of the hour.
  schedule:
    - cron: '47 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Tests to run'
        type: choice
        options: [all, smoke]
        default: all

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

env:
  # all: the full suite (scheduled, push and pull request runs); smoke: tests tagged @smoke (manual runs only).
  SUITE: ${{ github.event.inputs.suite || 'all' }}

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    # Pinned instead of ubuntu-latest, which moves to a new Ubuntu release that Playwright's
    # "install --with-deps" may not support yet. Update together with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Let every browser finish even if another one fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is always needed: the "setup" project registers the test account with it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Type check
        run: npm run typecheck

      # No real credentials on CI on purpose: traces and reports record typed values and form posts
      # in plain text, and uploaded artifacts are not masked. The setup project registers a
      # throwaway account on every run instead.
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} $([ "$SUITE" = smoke ] && echo --grep @smoke)
        env:
          BLOB_NAME: ${{ matrix.browser }}

      # Raw results, merged into a single report by the "report" job below.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

      # Allure results (steps + screenshots), combined into one Allure report by the "report" job.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 1

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge reports & email
    # Run after all browser jobs, whether they passed or failed.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Only a true/false flag here; the secrets themselves reach the send step alone, so other steps
      # (npm ci, report generation) never see the mail password. Secrets are not available to pull
      # requests from forks, so the email is skipped there.
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.MAIL_TO != '' }}
      HAS_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME != '' }}
      HAS_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD != '' }}
      HAS_MAIL_TO: ${{ secrets.MAIL_TO != '' }}

    steps:
      # Names (never values) of missing mail secrets appear as a warning on the run's summary page.
      - name: Check email settings
        run: |
          missing=""
          [ "$HAS_MAIL_USERNAME" = true ] || missing="$missing MAIL_USERNAME"
          [ "$HAS_MAIL_PASSWORD" = true ] || missing="$missing MAIL_PASSWORD"
          [ "$HAS_MAIL_TO" = true ] || missing="$missing MAIL_TO"
          if [ -n "$missing" ]; then
            echo "::warning title=Result email not sent::Missing Actions secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
          else
            echo "All mail secrets are set; the result email will be sent."
          fi

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # JUnit XML feeds the email summary (scripts/build-email.mjs).
      - name: Merge into one HTML report
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports --reporter html,junit ./all-blob-reports
          else
            echo "No blob reports found."
          fi
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit.xml

      - name: Upload merged HTML report
        if: ${{ hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Result files have unique names, so the three browsers' results can share one folder.
      - name: Download Allure results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # A single self-contained index.html: opens straight from disk and can be attached to the email.
      - name: Generate Allure report
        run: |
          if ls allure-results/*-result.json >/dev/null 2>&1; then
            npx allure generate allure-results
          else
            echo "No Allure results found."
          fi
        env:
          ALLURE_SINGLE_FILE: 'true'

      # Download, unzip and open index.html in a browser.
      - name: Upload Allure report
        if: ${{ hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      # Summary, failed tests and a link to this run; the Allure report is attached when it fits in Gmail.
      - name: Build email
        id: email
        if: ${{ !cancelled() && env.MAIL_CONFIGURED == 'true' }}
        run: |
          node scripts/build-email.mjs
          echo "subject=$(cat reports/email-subject.txt)" >> "$GITHUB_OUTPUT"
          if [ -f reports/allure-report.html ]; then
            echo "attachments=reports/allure-report.html" >> "$GITHUB_OUTPUT"
          fi
        env:
          BROWSER: chromium, firefox, webkit

      - name: Send email
        if: ${{ !cancelled() && env.MAIL_CONFIGURED == 'true' }}
        # Pinned to a commit (v22) because this third-party action receives the mail password.
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Demo Web Shop CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://reports/email.html
          attachments: ${{ steps.email.outputs.attachments }}
