name: Playwright Tests

on:
  # Daily run at 02:00 IST (cron is in UTC: 20:30 UTC = 02:00 IST next day).
  schedule:
    - cron: '30 20 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Let every browser finish even if another one fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is always needed: the "setup" project registers the test account with it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Type check
        run: npm run typecheck

      # No real credentials on CI on purpose: traces and reports record typed values and form posts
      # in plain text, and uploaded artifacts are not masked. The setup project registers a
      # throwaway account on every run instead.
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BLOB_NAME: ${{ matrix.browser }}

      # Raw results, merged into a single report by the "report" job below.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge report & email
    # Run after all browser jobs, whether they passed or failed.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only a true/false flag here; the secrets themselves are passed to the send step alone,
      # so other steps (npm ci, merge-reports) never see the mail password.
      # Secrets are not available to pull requests from forks, so the email step is skipped there.
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.MAIL_TO != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML + JSON report
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports --reporter html,json ./all-blob-reports
          else
            echo "No blob reports found."
          fi
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json

      - name: Upload merged HTML report
        if: ${{ hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Gmail rejects attachments over 25 MB; larger reports are only linked.
      - name: Zip report for email
        id: zip
        run: |
          if [ -f playwright-report/index.html ]; then
            (cd playwright-report && zip -qr ../playwright-report.zip .)
            size=$(stat -c %s playwright-report.zip)
            echo "Report zip: $size bytes"
            if [ "$size" -lt 20000000 ]; then
              echo "attachments=playwright-report.zip" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build email summary
        id: summary
        run: node .github/scripts/email-summary.js results.json email.html

      - name: Send email
        if: ${{ env.MAIL_CONFIGURED == 'true' }}
        # Pinned to a commit (v22) because this third-party action receives the mail password.
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Playwright CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.summary.outputs.subject }}
          html_body: file://email.html
          attachments: ${{ steps.zip.outputs.attachments }}
