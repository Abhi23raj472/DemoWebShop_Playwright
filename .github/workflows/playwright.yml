name: Playwright Tests

on:
  # Scheduled runs (07:00 smoke, 13:00 regression, IST) happen in Jenkins; see the Jenkinsfile.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Let every browser finish even if another one fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is always needed: the "setup" project registers the test account with it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Type check
        run: npm run typecheck

      # No real credentials on CI on purpose: traces and reports record typed values and form posts
      # in plain text, and uploaded artifacts are not masked. The setup project registers a
      # throwaway account on every run instead.
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          BLOB_NAME: ${{ matrix.browser }}

      # Raw results, merged into a single report by the "report" job below.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

      # Allure results (steps + screenshots), combined into one Allure report by the "report" job.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 1

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  report:
    name: Merge reports (Playwright + Allure)
    # Run after all browser jobs, whether they passed or failed.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: |
          if ls all-blob-reports/*.zip >/dev/null 2>&1; then
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports found."
          fi

      - name: Upload merged HTML report
        if: ${{ hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Result files have unique names, so the three browsers' results can share one folder.
      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Generate Allure report
        run: |
          if ls allure-results/*-result.json >/dev/null 2>&1; then
            npx allure generate allure-results
          else
            echo "No Allure results found."
          fi

      # Download, unzip and run `npx allure open <folder>` to view (it needs a local web server).
      - name: Upload Allure report
        if: ${{ hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
