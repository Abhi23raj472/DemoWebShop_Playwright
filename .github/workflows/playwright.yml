name: Playwright Tests

on:
  # Daily run at 02:00 IST (cron is in UTC: 20:30 UTC = 02:00 IST next day).
  schedule:
    - cron: '30 20 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Let every browser finish even if another one fails.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium is always needed: the "setup" project registers the test account with it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Type check
        run: npm run typecheck

      # No real credentials on CI on purpose: traces and reports record typed values and form posts
      # in plain text, and uploaded artifacts are not masked. The setup project registers a
      # throwaway account on every run instead.
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
